name: Add home features
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Mirai-launcher
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply home features
        run: |
          python3 scripts/add_home_features.py
          git config user.name entitybrian69-bit
          git config user.email entitybrian69@gmail.com
          git add -A
          git commit -m "Add quiet mode, night background, hold launch, and renderer memory"
          git push origin HEAD:Mirai-launcher
