name: Add home features
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Mirai-launcher
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fix the compile errors
        run: |
          python3 scripts/fix_compile.py
          git config user.name entitybrian69-bit
          git config user.email entitybrian69@gmail.com
          git add -A
          git commit -m "Fix the launch button and version name compile errors"
          git push origin HEAD:Mirai-launcher
