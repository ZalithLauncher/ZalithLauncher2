name: Build APK

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Android build variant
        required: true
        type: choice
        options:
          - Debug
          - Release
        default: Debug
  workflow_call:
    inputs:
      variant:
        required: true
        type: string
    secrets:
      KEY_PASSWORD:
        required: false
      STORE_PASSWORD:
        required: false
      OAUTH_CLIENT_ID:
        required: false
      CURSEFORGE_API_KEY:
        required: false

jobs:
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # One universal APK is enough for debug validation; keep per-ABI release packages.
        arch: ${{ inputs.variant == 'Debug' && fromJSON('["all"]') || fromJSON('["all", "arm", "arm64", "x86", "x86_64"]') }}
      fail-fast: false

    env:
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          add-job-summary: "on-failure"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            PetLib/rust/target
          key: petlib-rust-${{ runner.os }}-${{ hashFiles('PetLib/rust/Cargo.lock') }}
          restore-keys: petlib-rust-${{ runner.os }}-

      - name: Install cargo-ndk
        run: |
          version="4.1.2"
          mkdir -p "$HOME/.cargo/bin"
          curl --fail --silent --show-error --location "https://github.com/bbqsrc/cargo-ndk/releases/download/v${version}/cargo-ndk-x86_64-unknown-linux-gnu-v${version}.tgz" |
            tar xz -C "$HOME/.cargo/bin" --strip-components=1
          chmod +x "$HOME/.cargo/bin"/cargo-ndk*
          cargo ndk --version

      - name: Setup Android NDK
        run: |
          ndk="$ANDROID_HOME/ndk/25.2.9519653"
          if [ ! -f "$ndk/source.properties" ]; then
            sdkmanager --install "ndk;25.2.9519653"
          fi
          test -f "$ndk/source.properties"
          echo "Using NDK at $ndk"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ndk" >> "$GITHUB_ENV"

      - name: Build APK for ${{ matrix.arch }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon ZalithLauncher:assemble${{ inputs.variant }} \
            -Darch=${{ matrix.arch }} \
            -Plauncher_name=AEROO \
            -Plauncher_app_name="AEROO Launcher" \
            -Plauncher_short_name=AEROO \
            -Purl_home=https://github.com/zerobore/AEROO-LAUNCHER \
            -Papplication_id=com.aeroo.launcher

          if [ "${{ inputs.variant }}" = "Debug" ] && [ "${{ matrix.arch }}" = "all" ]; then
            mkdir -p ZalithLauncher/build/outputs/aeroo
            apk=$(find ZalithLauncher/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)
            test -n "$apk"
            cp "$apk" ZalithLauncher/build/outputs/aeroo/AEROO-debug.apk
          fi

      - name: Upload Release APK for ${{ matrix.arch }}
        if: inputs.variant == 'Release'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: release apk (${{ matrix.arch }})
          path: ZalithLauncher/build/outputs/apk/release/*.apk

      - name: Upload Release Mapping for ${{ matrix.arch }}
        if: inputs.variant == 'Release'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: mapping (${{ matrix.arch }})
          path: ZalithLauncher/build/outputs/mapping/release/mapping.txt

      - name: Upload Debug APK for ${{ matrix.arch }}
        if: inputs.variant == 'Debug'
        uses: actions/upload-artifact@v7
        with:
          name: AEROO-debug-${{ matrix.arch }}
          path: ZalithLauncher/build/outputs/aeroo/AEROO-debug.apk
          if-no-files-found: error
