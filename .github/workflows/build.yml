name: Build Mirai APKs

on:
  workflow_dispatch:
    inputs:
      variant:
        description: APK build variant
        required: true
        type: choice
        options:
          - Debug
          - Release
        default: Debug
  workflow_call:
    inputs:
      variant:
        required: true
        type: string
    secrets:
      KEY_PASSWORD:
        required: false
      STORE_PASSWORD:
        required: false
      OAUTH_CLIENT_ID:
        required: false
      CURSEFORGE_API_KEY:
        required: false

jobs:
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: ["all", "arm", "arm64", "x86", "x86_64"]
      fail-fast: false

    env:
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          add-job-summary: "on-failure"

      - name: Validate release signing configuration
        if: inputs.variant == 'Release'
        run: |
          if [[ -z "$STORE_PASSWORD" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Release builds require the STORE_PASSWORD and KEY_PASSWORD repository secrets."
            exit 1
          fi

      - name: Build APK for ${{ matrix.arch }}
        run: |
          chmod +x gradlew
          ./gradlew ZalithLauncher:assemble${{ inputs.variant }} -Darch=${{ matrix.arch }}

      - name: Upload Mirai Release APK for ${{ matrix.arch }}
        if: inputs.variant == 'Release'
        uses: actions/upload-artifact@v7
        with:
          name: mirai-release-apk-${{ matrix.arch }}
          path: ZalithLauncher/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload Release Mapping for ${{ matrix.arch }}
        if: inputs.variant == 'Release'
        uses: actions/upload-artifact@v7
        with:
          name: mirai-release-mapping-${{ matrix.arch }}
          path: ZalithLauncher/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      - name: Upload Mirai Debug APK for ${{ matrix.arch }}
        if: inputs.variant == 'Debug'
        uses: actions/upload-artifact@v7
        with:
          name: mirai-debug-apk-${{ matrix.arch }}
          path: ZalithLauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
