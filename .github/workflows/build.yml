name: Build Mirai APKs

on:
  workflow_dispatch:
    inputs:
      variant:
        description: APK build variant
        required: true
        type: choice
        options:
          - Debug
          - Release
        default: Debug
  workflow_call:
    inputs:
      variant:
        required: true
        type: string
    secrets:
      KEY_PASSWORD:
        required: false
      STORE_PASSWORD:
        required: false
      OAUTH_CLIENT_ID:
        required: false
      CURSEFORGE_API_KEY:
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: ["all", "arm", "arm64", "x86", "x86_64"]
      fail-fast: false

    env:
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          add-job-summary: "on-failure"

      - name: Validate release signing configuration
        if: inputs.variant == 'Release'
        run: |
          if [[ -z "$STORE_PASSWORD" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Release builds require the STORE_PASSWORD and KEY_PASSWORD repository secrets."
            exit 1
          fi
          if [[ ! -s "ZalithLauncher/zalith_launcher.jks" ]]; then
            echo "::error::The tracked Release signing keystore is missing."
            exit 1
          fi

      - name: Build APK for ${{ matrix.arch }}
        id: build-apk
        run: |
          set -euo pipefail
          chmod +x gradlew
          build_log="${RUNNER_TEMP}/mirai-gradle-${{ matrix.arch }}.log"
          set +e
          ./gradlew ZalithLauncher:assemble${{ inputs.variant }} -Darch=${{ matrix.arch }} --console=plain --stacktrace 2>&1 | tee "$build_log"
          gradle_status=${PIPESTATUS[0]}
          exit "$gradle_status"

      - name: Publish Gradle failure details
        if: ${{ always() && steps.build-apk.outcome == 'failure' }}
        env:
          MIRAI_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          build_log="${RUNNER_TEMP}/mirai-gradle-${MIRAI_ARCH}.log"
          if [[ ! -s "$build_log" ]]; then
            echo "No Gradle output was captured for ${MIRAI_ARCH}." >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Gradle build failure::No Gradle output was captured."
            exit 0
          fi
          python3 - "$build_log" "$MIRAI_ARCH" "$GITHUB_STEP_SUMMARY" <<'PY'
          import pathlib
          import sys

          log_path, arch, summary_path = sys.argv[1:]
          import re

          lines = pathlib.Path(log_path).read_text(errors="replace").splitlines()
          marker = "FAILURE: Build failed with an exception."
          failure_index = max((i for i, line in enumerate(lines) if marker in line), default=-1)

          def section(title, selected, limit):
              body = "\n".join(line[:1000] for line in selected)
              if len(body) > limit:
                  body = body[:limit - 32] + "\n...[section truncated]..."
              return f"{title}\n{body}" if body else ""

          if failure_index >= 0:
              summary_end = next(
                  (i for i in range(failure_index + 1, len(lines))
                   if lines[i].lstrip().startswith(("* Try:", "* Exception is:"))),
                  min(len(lines), failure_index + 80),
              )
              summary = section("Gradle failure summary:", lines[failure_index:summary_end], 1700)
              diagnostic_pattern = re.compile(
                  r"(^\s*(?:e:|w:)\s|error:|fatal error:|CMake Error|"
                  r"Execution failed for task|Could not (?:resolve|find)|"
                  r"No space left|UnknownHostException|OutOfMemoryError|"
                  r"FAILED|failed to run|undefined reference|ninja:)",
                  re.IGNORECASE,
              )
              diagnostics = [line for line in lines[:failure_index] if diagnostic_pattern.search(line)][-60:]
              diagnostic_text = section("Relevant compiler/build output:", diagnostics, 1350)
              stack = section("Stack trace ending:", lines[-12:], 350)
              excerpt = "\n\n".join(part for part in (summary, diagnostic_text, stack) if part)
          else:
              excerpt = "\n".join(lines[-120:])[-3200:]

          if not excerpt:
              excerpt = "Gradle exited unsuccessfully without writing diagnostic output."
          if len(excerpt) > 3500:
              excerpt = excerpt[:3460] + "\n...[output truncated]..."

          pathlib.Path(summary_path).write_text(
              f"## Gradle build failure ({arch})\n\n```text\n{excerpt}\n```\n",
              encoding="utf-8",
          )
          message = f"Gradle build failed for {arch}:\n{excerpt}"
          encoded = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Gradle build failure ({arch})::{encoded}")
          PY

      - name: Verify Release APK signatures
        if: inputs.variant == 'Release'
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$sdk_root" || ! -d "$sdk_root/build-tools" ]]; then
            echo "::error::Android SDK build-tools were not found."
            exit 1
          fi
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [[ -z "$apksigner" ]]; then
            echo "::error::apksigner was not found in Android SDK build-tools."
            exit 1
          fi
          for apk in ZalithLauncher/build/outputs/apk/release/*.apk; do
            "$apksigner" verify --verbose "$apk"
          done

      - name: Verify LTW and LTW Legacy native libraries in the APK
        run: |
          if [[ "${{ inputs.variant }}" == "Release" ]]; then
            apk_dir="ZalithLauncher/build/outputs/apk/release"
          else
            apk_dir="ZalithLauncher/build/outputs/apk/debug"
          fi
          python3 .github/scripts/verify_ltw_apk.py "${{ matrix.arch }}" "$apk_dir"

      - name: Test renderer wiring and source policy
        id: unit-tests
        if: inputs.variant == 'Debug' && matrix.arch == 'all'
        run: |
          set -uo pipefail
          test_log="${RUNNER_TEMP}/mirai-unit-tests.log"
          ./gradlew ZalithLauncher:testDebugUnitTest \
            --tests "com.movtery.zalithlauncher.game.renderer.LTWRendererTest" \
            --tests "com.movtery.zalithlauncher.game.renderer.LTWLegacyRendererTest" \
            --tests "com.movtery.zalithlauncher.game.renderer.RendererPickerTest" \
            --tests "com.movtery.zalithlauncher.game.addons.mirror.MirrorPreferencesTest" \
            --tests "com.movtery.zalithlauncher.game.account.wardrobe.FileReplacementTest" \
            -Darch=all --console=plain 2>&1 | tee "$test_log"
          exit "${PIPESTATUS[0]}"

      - name: Publish unit test failures
        if: ${{ always() && steps.unit-tests.outcome == 'failure' }}
        env:
          MIRAI_TEST_REPORT_DIR: ZalithLauncher/build/test-results/testDebugUnitTest
          MIRAI_TEST_LOG: ${{ runner.temp }}/mirai-unit-tests.log
        run: python3 .github/scripts/publish_unit_test_failures.py

      - name: Upload Mirai Release APK for ${{ matrix.arch }}
        if: inputs.variant == 'Release'
        uses: actions/upload-artifact@v7
        with:
          name: mirai-release-apk-${{ matrix.arch }}
          path: ZalithLauncher/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload Release Mapping for ${{ matrix.arch }}
        if: inputs.variant == 'Release'
        uses: actions/upload-artifact@v7
        with:
          name: mirai-release-mapping-${{ matrix.arch }}
          path: ZalithLauncher/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      - name: Upload Mirai Debug APK for ${{ matrix.arch }}
        if: inputs.variant == 'Debug'
        uses: actions/upload-artifact@v7
        with:
          name: mirai-debug-apk-${{ matrix.arch }}
          path: ZalithLauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
