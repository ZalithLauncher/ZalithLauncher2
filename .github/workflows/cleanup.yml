name: Cleanup

on:
  workflow_call:
  workflow_dispatch:
   inputs:
     cleanup_all_releases:
      type: boolean
      description: "Whether to Delete All Releases"
      required: true
      default: false

concurrency:
  group: clean
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions: write-all
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Delete Older Releases and Workflows
        uses: ophub/delete-releases-workflows@main
        if: ${{ inputs.cleanup_all_releases == false }}
        with:
          delete_releases: true
          delete_tags: true
          releases_keep_latest: 200
          delete_workflows: false
          releases_keep_keyword: stable/beta/update
          gh_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete All Releases and Older Workflows
        uses: ophub/delete-releases-workflows@main
        if: ${{ inputs.cleanup_all_releases == true }}
        with:
          delete_releases: true
          delete_tags: true
          releases_keep_latest: 0
          delete_workflows: false
          gh_token: ${{ secrets.GITHUB_TOKEN }}
