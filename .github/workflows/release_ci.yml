name: Mirai Release APKs

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  Build:
    uses: ./.github/workflows/build.yml
    with:
      variant: Release
    secrets:
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

  Upload-to-Release:
    needs: Build
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Checkout release source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts

      - name: Collect and verify all five ABI APKs
        run: |
          set -euo pipefail
          mkdir -p ./apks
          find ./artifacts -type f -name "*.apk" -exec cp {} ./apks/ \;
          for apk in ./apks/*.apk; do
            case "$apk" in
              *-armeabi-v7a.apk) arch=arm ;;
              *-arm64-v8a.apk) arch=arm64 ;;
              *-x86_64.apk) arch=x86_64 ;;
              *-x86.apk) arch=x86 ;;
              *.apk) arch=all ;;
            esac
            python3 .github/scripts/verify_ltw_apk.py "$arch" "$apk"
          done
          python3 .github/scripts/mirai_release.py verify ./apks

      - name: Read Mirai version metadata
        id: version
        run: |
          set -euo pipefail
          version_code="$(sed -n 's/^launcher_version_code=//p' ZalithLauncher/gradle.properties | head -n 1)"
          version_name="$(sed -n 's/^launcher_version_name=//p' ZalithLauncher/gradle.properties | head -n 1)"
          test -n "$version_code"
          test -n "$version_name"
          echo "code=$version_code" >> "$GITHUB_OUTPUT"
          echo "name=$version_name" >> "$GITHUB_OUTPUT"

      - name: Generate Mirai update metadata
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PUBLISHED_AT: ${{ github.event.release.published_at }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          python3 .github/scripts/mirai_release.py metadata \
            --apks-directory ./apks \
            --output ./mirai-update.json \
            --repository "$RELEASE_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --published-at "$RELEASE_PUBLISHED_AT" \
            --version-code "$VERSION_CODE" \
            --version-name "$VERSION_NAME"

      - name: Upload APKs and update metadata to the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            ./apks/*.apk
            ./mirai-update.json
          fail_on_unmatched_files: true
