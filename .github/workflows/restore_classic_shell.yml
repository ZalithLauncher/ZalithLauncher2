name: Restore classic shell
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Mirai-launcher
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Restore the original main menu files
        run: |
          git checkout e30fbde62cffd2f6e1c3ce4adcf87cb83fb363b5 -- \
            MiraiLauncher/src/main/java/com/movtery/zalithlauncher/ui/screens/main/MainScreen.kt \
            MiraiLauncher/src/main/java/com/movtery/zalithlauncher/ui/screens/main/MiraiNavigationRail.kt \
            MiraiLauncher/src/main/java/com/movtery/zalithlauncher/ui/screens/content/LauncherScreen.kt
          git config user.name entitybrian69-bit
          git config user.email entitybrian69@gmail.com
          git commit -m "Restore the original main menu shell"
          git push origin HEAD:Mirai-launcher
