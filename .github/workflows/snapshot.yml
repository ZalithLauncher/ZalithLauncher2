name: Create Snapshot Tag

on:
  push:
    branches:
      - 'main'
      - 'master'
  workflow_dispatch:
    inputs:
      description:
        description: 'Description for the snapshot release'
        required: false
        default: 'Automated snapshot build'

permissions:
  contents: write

jobs:
  create-snapshot:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Need full history for tag creation

      - name: Get current date info
        id: date
        run: |
          YEAR=$(date +%y)
          WEEK=$(date +%V)
          WEEK_CHAR=$(printf "\c" $(( $(date +%V) % 26 + 97 )))
          echo "year=$YEAR" >> $GITHUB_OUTPUT
          echo "week=$WEEK" >> $GITHUB_OUTPUT
          echo "week_char=$WEEK_CHAR" >> $GITHUB_OUTPUT

      - name: Generate snapshot tag
        id: tag
        run: |
          # Generate tag like 26w31a
          SNAPSHOT_TAG="${{ steps.date.outputs.year }}w${{ steps.date.outputs.week }}${{ steps.date.outputs.week_char }}"
          
          # Check if tag already exists
          if git rev-parse "$SNAPSHOT_TAG" >/dev/null 2>&1; then
            echo "Tag $SNAPSHOT_TAG already exists!"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "tag=$SNAPSHOT_TAG" >> $GITHUB_OUTPUT
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create snapshot tag
        if: steps.tag.outputs.exists == 'false'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag ${{ steps.tag.outputs.tag }} -a -m "Snapshot release ${{ steps.tag.outputs.tag }}: ${{ github.event.inputs.description }}"
          git push origin ${{ steps.tag.outputs.tag }}
          echo "Created tag: ${{ steps.tag.outputs.tag }}"

      - name: Output result
        if: steps.tag.outputs.exists == 'true'
        run: |
          echo "::error::Snapshot tag ${{ steps.tag.outputs.tag }} already exists!"
          exit 1
