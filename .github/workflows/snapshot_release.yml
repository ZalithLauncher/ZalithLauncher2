name: Snapshot Release

on:
  push:
    tags:
      - '**w**'  # Matches tags like 26w31a

permissions:
  contents: read

jobs:
  Build:
    uses: ./.github/workflows/build.yml
    with:
      variant: Release
    secrets:
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

  Upload-Snapshot:
    needs: Build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: success()

    permissions:
      contents: write

    steps:
      - name: Download Files
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts

      - name: Organize Artifacts
        run: |
          mkdir -p ./apks
          mkdir -p ./mappings
          
          find ./artifacts -name "*.apk" -type f -exec cp {} ./apks/ \;
          
          for dir in ./artifacts/*/; do
            dir_name=$(basename "$dir")
            
            # Skip APK
            if [[ "$dir_name" == *"release apk"* ]]; then
              continue
            fi
            
            if [[ "$dir_name" == mapping* ]]; then
              (cd "$dir" && zip -r "../${dir_name}.zip" .)
              mv "./artifacts/${dir_name}.zip" ./mappings/
            fi
          done
          
          echo "Found $(ls ./apks/ | wc -l) APK file(s)"
          echo "Found $(ls ./mappings/ | wc -l) Mapping file(s)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Snapshot ${{ github.ref_name }}
          body: |
            Automated snapshot release for commit ${{ github.sha }}.
            
            **Tag:** `${{ github.ref_name }}`
            **Commit:** ${{ github.sha }}
          prerelease: true
          make_latest: false
          files: |
            ./apks/*.apk
            ./mappings/*.zip
          fail_on_unmatched_files: true
